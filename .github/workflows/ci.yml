name: CI

# Every push to main and every pull request: gofmt, vet, the Go tests (the
# readers, the manifest, the app against plugintest's fake filex), the
# page's tests, the interface bundle and the wasm module. The build is kept
# for a week, so a reviewer can install exactly what a pull request builds
# (Admin → Plugins → Apps → Install an app → Upload files: plugin.wasm,
# filex-app.json and ui.zip).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The compiler scripts/build.sh forces, so the tests and the build here
      # are the ones a release runs.
      - name: Use the toolchain go.mod pins
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"

      - name: manifest.embed.json follows filex-app.json
        run: |
          go generate ./...
          git diff --exit-code -- manifest.embed.json

      - name: Tests, then the bundle and the module
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-thumbs
          path: |
            dist/plugin.wasm
            dist/plugin.wasm.sha256
            dist/ui.zip
            dist/ui.zip.sha256
            dist/filex-app.json
          retention-days: 7
